<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Corte Certo — Agendamento online</title>
  <meta name="description" content="Agende seu corte na Corte Certo em poucos cliques." />
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
 <!-- Barra superior: Logo e Alternador de modo -->
  <header class="topbar">
    <a class="brand" href="#" data-action="home" aria-label="Corte Certo — início">
      <span class="brand-mark">CC</span>
      <span class="brand-name">CORTE CERTO<small>barbearia &amp; estilo</small></span>
    </a>
    <nav class="mode-switch" aria-label="Modo">
      <button type="button" data-mode="customer" class="active">Cliente</button>
      <button type="button" data-mode="admin">Admin</button>
    </nav>
  </header>

  <!-- Interface principal -->
  <main id="app" class="shell" aria-live="polite"></main>

  <!-- Camadas globais -->
  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status"></div>

  <noscript>Ative o JavaScript para usar o agendamento.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
